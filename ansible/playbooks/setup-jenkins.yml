---
# ================================================================
# Jenkins Installation — Runs on jenkins group only
# ================================================================

- name: Setup Jenkins server
  hosts: jenkins
  become: true

  tasks:
    # ── Install Java (Jenkins requirement) ──
    - name: Install OpenJDK 17
      apt:
        name: openjdk-17-jdk
        state: present

    # ── Install Jenkins ──
    - name: Add Jenkins GPG key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        state: present

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb https://pkg.jenkins.io/debian-stable binary/"
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes

    # ── Configure Jenkins ──
    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins to apply docker group
      systemd:
        name: jenkins
        state: restarted

    - name: Wait for Jenkins to start (port 8080)
      wait_for:
        port: 8080
        delay: 10
        timeout: 120

    - name: Get Jenkins initial admin password
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_password
      changed_when: false

    - name: Display Jenkins initial password
      debug:
        msg: |
          ═══════════════════════════════════════
          Jenkins is ready!
          URL: http://{{ ansible_host }}:8080
          Initial Admin Password: {{ jenkins_password.stdout }}
          ═══════════════════════════════════════

    # ── Install kubectl on Jenkins server (for deployments) ──
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Display kubectl version
      debug:
        msg: "kubectl installed: {{ kubectl_version.stdout }}"
