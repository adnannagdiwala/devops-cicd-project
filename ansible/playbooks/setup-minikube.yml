---
# ================================================================
# Minikube Installation — Runs on app server only
# ================================================================

- name: Setup Minikube on App Server
  hosts: app
  become: true

  tasks:
    # ── Install kubectl ──
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    # ── Install Minikube ──
    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Verify Minikube installation
      command: minikube version
      register: minikube_version
      changed_when: false

    - name: Display Minikube version
      debug:
        msg: "{{ minikube_version.stdout }}"

    # ── Start Minikube (as ubuntu user, not root) ──
    - name: Start Minikube
      become: true
      become_user: ubuntu
      command: >
        minikube start
        --driver=docker
        --cpus=2
        --memory=4096
        --disk-size=20g
      args:
        creates: /home/ubuntu/.minikube/profiles/minikube/config.json

    # ── Enable Minikube Addons ──
    - name: Enable ingress addon
      become: true
      become_user: ubuntu
      command: minikube addons enable ingress
      changed_when: false

    - name: Enable metrics-server addon
      become: true
      become_user: ubuntu
      command: minikube addons enable metrics-server
      changed_when: false

    - name: Enable dashboard addon
      become: true
      become_user: ubuntu
      command: minikube addons enable dashboard
      changed_when: false

    # ── Verify ──
    - name: Check cluster status
      become: true
      become_user: ubuntu
      command: kubectl get nodes
      register: nodes_output
      changed_when: false

    - name: Display cluster status
      debug:
        msg: |
          ═══════════════════════════════════════
          Minikube Cluster is Ready!
          {{ nodes_output.stdout }}
          ═══════════════════════════════════════

    # ── Create app namespace ──
    - name: Create app namespace
      become: true
      become_user: ubuntu
      command: kubectl create namespace app
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when: "ns_result.rc != 0 and 'already exists' not in ns_result.stderr"

    - name: Create monitoring namespace
      become: true
      become_user: ubuntu
      command: kubectl create namespace monitoring
      register: ns_result
      changed_when: "'created' in ns_result.stdout"
      failed_when: "ns_result.rc != 0 and 'already exists' not in ns_result.stderr"
