# ================================================================
# Ansible Inventory — Update IPs after running AWS CLI scripts
# ================================================================

[jenkins]
jenkins-server ansible_host=<JENKINS_PUBLIC_IP>

[app]
app-server ansible_host=<APP_PUBLIC_IP>

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/devops-project-key.pem
ansible_python_interpreter=/usr/bin/python3

# Docker Hub credentials (update these!)
dockerhub_username=yourusername
dockerhub_password=yourpassword
